[package]
name = "aox-gui"
version = "0.1.0"
edition = "2021"
description = "AOX GUI — a minimal graphical front-end that reuses the aox core library (agent loop / plugin host / Ui abstraction)"

[[bin]]
name = "aox-gui"
path = "src/main.rs"

[dependencies]
# Reuse the very same core library as the CLI build; the GUI does not modify or duplicate the agent logic.
aox = { path = ".." }

# Immediate-mode GUI (glow/OpenGL backend) — pure Rust, single-file distribution, no WebView/Node required.
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only needed to obtain the window handle (HWND on Windows), used to set DWM attributes directly and tint the
# native title bar to match the UI. The version must match the one eframe 0.33 depends on, or the trait won't line up.
raw-window-handle = "0.6"
