# AOX — a self-growing AI coding agent
# Copy this file to config.toml and fill in your configuration
#
# ⚠️ This file is the **last configuration layer** (stage 5). On top of it you can still stack
#    the factory bundles and the patch files you list in aox.toml; the priority is
#    **bundle < patch < this file**.
#    In other words, **what you write here always wins** -- an existing configuration needs no
#    migration for "layering" at all.
#    To see the merged result: aox --dump-config (once running you can also type /config for
#    the layer list).
#    To customize the layering: copy aox.example.toml to aox.toml.

# ── the model ──────────────────────────────────────────────────────────────────────────
# There is deliberately **no [provider] section here**: since 2026-10-28 the endpoint, the key,
# the model name and its parameters (context window / output cap / temperature / thinking) are
# managed inside the program and stored in `.aox/models.json` — add or edit them in
# **Settings → Model**, or in the chip under the input box. That file is the only place a key
# lives, and it travels with this installation.
#
# A `[provider]` left here by an older version is **read once** at startup and moved into
# `.aox/models.json`; after that it is inert, so delete it.

[auth]
# Meta tools (create_plugin / remove_plugin and other operations that change the system
# itself): ask | auto | deny
meta_tools = "ask"
# Tools from plugins the model built for itself: ask | auto | deny
plugin_tools = "auto"
# Overriding by individual tool name or plugin name:
#   * a complete name = an exact match, e.g. shell_exec
#   * a trailing `*` = a prefix wildcard, to block "a class of tools" in one go
#     Note the wildcard looks only at the prefix and knows nothing about separators: `fs*`
#     hits fsx too, so write `fs_*` when you mean one group of tools; a lone `*` is a
#     catch-everything fallback. Wildcards arrived in stage 4; old configs need no change.
#   * ⚠️ a key containing `*` **must be quoted**: TOML bare keys allow only letters, digits,
#     `_` and `-`, so `fs_* = "deny"` fails to parse outright -- write `"fs_*" = "deny"`.
# [auth.overrides]
# shell_exec = "ask"
# "fs_*"     = "deny"

[agent]
# Project rules file; injected into the system prompt if present
rules_file = "RULES.md"
# Timeout for a single tool call (seconds)
tool_timeout_secs = 120
# Maximum number of characters of a tool result sent back to the model (truncated past this)
max_result_chars = 20000
# Token budget for ONE request. When the conversation outgrows it, the host folds the oldest turns
# into a summary *for the request only* — the conversation file keeps every message.
#   0 (default) = derive it from [provider] context_window x compact_ratio, and if context_window is
#                 not set either, compaction stays off (an unknown window is never guessed at).
#   > 0         = use this as the input budget directly.
context_budget_tokens = 0
# How much of context_window may be used for input; the reply's max_tokens is then reserved on top.
# Clamped to 0.3..1.0.
compact_ratio = 0.8

[prompt]
# The system prompt is assembled from several "segments"; this is how you override them on
# your own machine.
#   Built in:  core (identity and core facts) / protocol (the plugin protocol and built-in
#              rules)
#   Generated: env (the runtime environment: the host's real paths + this machine's
#              interpreter situation) / rules (RULES.md project rules)
# To see what is actually assembled right now: type /prompt at the command line
#
# Note: this section entirely empty = entirely the built-in order, **byte for byte identical**
# to the built-in prompt.
# Any change invalidates the server-side prompt cache once (the prefix changed); that is a
# normal price to pay.

# Explicit order: the listed segments are moved to the front in this order, and unlisted ones
# keep their default order after them.
# So "just move the runtime environment to the front" is a single line, not all four segments.
# order = ["env"]

# Segments to disable. For instance, if you don't plan to use plugins for now, drop the whole
# protocol section.
# disable = ["protocol"]

# Append custom segments; if the id matches a built-in one (core / protocol), it **replaces
# that built-in segment wholesale**.
# [[prompt.segment]]
# id = "style"
# title = "Team style"
# order = 50
# body = """
# Always answer in English: the conclusion first, then the reasons.
# """

# ── loop hooks (added in stage 4) ────────────────────────────────────────────────
#
# Hooks let the host stick a foot in "before the model request / after the reply / around a
# tool call / when a request errors", to nudge system behaviour without touching the main loop.
#
# Everything below is commented out: writing nothing = not a single hook registered, and the
# behaviour is **exactly** the built-in loop.
# To see which hooks are in force right now, type /hook at the command line (hooks are fixed
# at startup, so a change needs a restart).
#
# This release opens exactly one capability -- supplying **default arguments** to a given tool:
#   * only filled in when the model didn't pass that key; a value the model passed explicitly
#     is never touched (overriding the model's explicit intent produces "the model said A and
#     the tool received B", the hardest kind of problem to find).
#   * values may be strings / numbers / booleans / arrays, written the way TOML writes them.
#
# Note: "ban a class of tools" is **not here** -- that is an authorization matter, written in
# [auth.overrides] with a wildcard key like fs_*; this section only governs "once allowed,
# should the arguments be changed".
#
# [hook.tool_args_default.fs_read_file]
# encoding = "utf-8"
#
# [hook.tool_args_default.myplugin_write]
# create_dirs = true
#
# A second capability (stage 6 · 6b) -- have the host **itself** retry a few times when a
# request errors. As of 2026-10-23 the budget lives in [retry], not here: it never belonged to
# the hook seam, and it has to agree with the delay curve next to it.
#      Components (the [contributes] hooks of a plugin's plugin.toml) can also request retries,
#      and that path takes precedence; [retry] is the fallback that works when no component
#      asks at all.

# ── failing model requests (2026-10-23) ──────────────────────────────────────────
#
# Only "the request itself never produced a reply" is retried — never a tool call: a tool can
# have side effects, so the host may report a failure but must never run it twice on its own.
# And only failures that could plausibly succeed on the next try: 429 / 5xx / connection errors
# / a stream that stopped mid-answer. A 401, a wrong model name or a context that is too long
# fails on the first attempt.
#
# [retry]
# attempts = 2      # extra attempts after the first; total requests <= attempts + 1. 0 = off.
# base_ms  = 1000   # first wait; it doubles per attempt: 1s, 2s, 4s …
# max_ms   = 30000  # ceiling for one wait, and for a `Retry-After` the endpoint sends — an
#                   # endpoint asking for an hour must not leave the turn silent for an hour.
#
# Defaults are the three values above, i.e. nothing is written and retries are already on.
# Note that a retry re-sends a **byte-identical** request and injects no message into the
# conversation: the failed attempt never touched the history.

# ── the main loop (stage 6 · 6a) ──────────────────────────────────────────────────
#
# This section decides **which loop skeleton** runs a whole turn (ask the model -> run tools ->
# fill results back in). [hook] can only plug into five points inside the loop; the skeleton
# itself is fixed. [loop] swaps the skeleton.
#
# Also commented out entirely: writing nothing means standard + no context pruning, behaviour
# **byte for byte identical** to before.
# To see what is in force right now, type /loop at the command line (fixed at startup, so a
# change needs a restart).
#
# [loop]
# impl = "standard"
#
#   —— this release recognizes only standard (the built-in one). Any other name **errors out
#      at startup** rather than falling back quietly -- the same reasoning as [store] backend.
#
# max_rounds = 6
#
#   —— how many "user turns" the context keeps at most; 0 (the default) = unlimited.
#      A turn is bounded by one user message; pruning always drops from the **oldest whole
#      turn**, and the system-prompt message is never dropped.
#      So a pruned context is still a legal request body -- it can't leave behind a half-message
#      like "the tool result is still here but its assistant was dropped", which the endpoint
#      would reject outright.
#      Pruning changes **both** memory and the conversation file (rollback is symmetric), so
#      reading it back after a restart isn't truncated.
#      ⚠️ It is a "cap", not a "target": while the turn count is below it, nothing is pruned.
#
# max_iters_per_turn = 50
#
#   —— the other ceiling, and the two are easy to confuse:
#         max_rounds          caps how much **context** is kept
#         max_iters_per_turn  caps how much **work** one instruction may cost
#      A turn spends one request per round (one model reply + the tools it asked for). 0 (the
#      default) = no limit, exactly as before this key existed. With a value, the turn stops
#      normally when it is reached -- the checkpoint is persisted, the card is closed, and the
#      user is told which ceiling fired, so "the task died silently" does not happen.
#      50 is a reasonable number to start from: a heavy real turn uses 10-20.

# ── plugin process fence (Job Object) ─────────────────────────────────────────────
#
# Every plugin subprocess goes into its own Windows Job Object, which governs three things:
# how many processes it may open, how much memory it may use, and whether it may touch the
# host's windows / clipboard / desktop.
#
# Type /sandbox at the command line to see the limits currently in force. The "fence ✓ / ✗"
# marker shown next to a plugin in /plugins is exactly this -- ✗ means that process didn't enter
# a Job (the sandbox is off, or the outer Job doesn't allow nesting). A **dormant** plugin shows
# no marker at all, because it has no process to fence (see [plugins] further down).
#
# ⚠️ It **cannot govern files or the network**: a Job Object has no such ability. Which is why
#    it is a "fence" and not a "sandbox" -- /sandbox's output repeats that sentence verbatim,
#    so nobody walks away thinking file deletion is already blocked.
#
# What follows is **not an example; it is the default currently in force** (this section is on
# by default).

[sandbox]
# Master switch. false = no Job created, no CREATE_SUSPENDED added; byte for byte identical to
# before the fence existed.
enabled = true

# How many more child processes each plugin may open (the plugin itself excluded).
#   0 = none at all (the only setting that truly locks this path down: plugins that need to
#      fork will report WinError 1816)
#   8 = the default. Enough for real usage like "plugin -> shell -> tool", while still a small
#      allowance -- one plugin's whole process group is at most 9, and a fork bomb grows by
#      doubling, so a cap here stops it from getting off the ground.
# To open it up, write a large number (1000, say); **don't write 0** -- 0 here means "none at
# all", the opposite direction from max_memory_mb = 0 (unlimited) below: asked "how many are
# allowed", 0 means zero.
# The allowance is **per plugin** (one Job per plugin), not a global budget -- otherwise one
# plugin could eat the whole allowance and the rest couldn't even start.
max_processes = 8

# Memory ceiling (MB). 0 = unlimited, which is also the default.
# ⚠️ Why it is off by default: exceeding the limit **kills the whole process in the kernel**,
#    it isn't one failed allocation -- a cap that is too tight will kill outright a plugin that
#    is legitimate but memory-hungry, and nothing is visible from the plugin's side; it just
#    looks like "the plugin keeps getting restarted for no reason", which is very hard to
#    diagnose. Turn it on deliberately if you want it.
max_memory_mb = 0

# Forbid the plugin from using the host process's USER objects (windows / clipboard / desktop /
# global atoms). Plugins don't need any of these -- all their communication with the host goes
# through stdin/stdout pipes.
ui_limits = true

# ── plugin lazy loading ───────────────────────────────────────────────────────────
#
# A plugin is an interpreter process. Without this section every plugin under plugins/ was
# started at boot and stayed resident for as long as the program ran -- a shelf of idle
# python.exe processes (10-15 MB each) that nobody was calling.
#
# A plugin slot now has two states:
#
#   dormant   no process. Metadata only (a few hundred bytes). **Its tools are still registered
#             and still callable** -- the model sees them exactly as before, and the first call
#             starts the process (tens of milliseconds).
#   active    the child process + its Job fence.
#
# Startup reads `plugin.toml` plus `plugins/<name>/plugin.cache.json` (the last known tool list,
# written by the host) and starts nothing. The background reaper closes a process once it has
# been idle for `idle_timeout_secs`, so the plugin table returns to 0 processes by itself.
#
# The one thing to know: the tool list comes from a cache, so a plugin whose source was edited
# since its last run may briefly advertise a stale tool table. It self-heals -- every real start
# re-reads the tools, re-registers anything that changed, and rewrites the cache -- so the worst
# case is one wasted call. To force a rebuild by hand, delete that plugin's plugin.cache.json.
#
# Type /plugins at the command line to see each slot's state.

[plugins]
# Master switch. false = every plugin is started at boot and stays resident until exit, exactly
# like before this feature existed (the escape hatch; nothing else in this section applies).
lazy = true

# How many seconds a plugin process may sit unused before it is closed. 0 = never close one.
# Why a grace period rather than "close it the moment the call returns": a task usually calls the
# same plugin several times in a row, and re-starting an interpreter costs tens of milliseconds.
# A minute is invisible to the user but leaves nothing behind by the time you look at the task
# manager.
idle_timeout_secs = 60

# Upper bound on **simultaneously live** plugin processes. 0 = unlimited (the default).
# Over the cap, the longest-idle process is closed first to make room. Leave it at 0 unless memory
# is genuinely tight: a turn that alternates between a hook component and a tool plugin could
# otherwise be forced to start a process on every single round.
max_resident = 0

# Plugin names that **always stay resident**, even when idle.
# For components that fire on every turn ([contributes] hooks in plugin.toml): they count as "in
# use" at the start of every request, so under lazy loading they would be started, closed and
# started again each round. List them here and they are started at boot like they used to be.
# eager = ["my_component"]

[tools]
# How many registered tools the model is shown at once.
#
# At or below this number the whole registry is sent with every request -- byte-identical to the
# behaviour before this section existed. The default (24) covers the 14 host tools plus a handful of
# plugins, so a light install never notices this section at all. 0 = never hold anything back.
#
# Above it, **plugin** tools are left out of the request until the model calls find_tools (tools of a
# plugin it has just built appear immediately, no lookup needed). The host's own tools are always
# listed: the line is drawn by the tool's kind, not by a hand-written name list, so adding a host
# tool later can never accidentally make it invisible.
#
# Why bother: every schema is paid for on every request, and a long list also lowers the chance the
# model picks the right tool at all. Hiding is **advertising only** -- a hidden tool still runs when
# called by name, so this can never turn a working plugin into a broken one.
inline_max = 24

# Tools that stay listed no matter what, plugin tools included. Useful when you always want one
# plugin at hand and would rather not spend a lookup on it. Unknown names are ignored, so deleting a
# plugin does not leave a broken config behind.
# enabled = ["fs_ls", "sysinfo_pro_overview"]

[workplace]
# Which files the model may touch ("take file capability back from the model"). Note that this
# is **a separate matter** from [sandbox] above:
#   [sandbox]   governs "how plugin subprocesses run" (may they open children / how much memory
#               may they use / may they touch the host's windows)
#   [workplace] governs "where this session may write, and what it may delete"
# The section was renamed from [workspace] to [workplace] on 2026-10-04 (**the old name still
# works**, so older configs don't break).
#
# "default" = **the default**: the workspace is the app root itself, and writes and deletes may
#             land only under it (reading is unrestricted). Keep the tree tidy by convention:
#             scratch files go in <app root>/temp/, and each durable deliverable gets its own
#             folder under <app root>/workplace/<project>/. The AI also keeps its own dated notes
#             in <root>/.aox/memory/<YYYY-MM-DD>.md (that folder is created on first use).
# "full"    = unrestricted. You must **write it explicitly** -- as of 2026-10-05 the factory
#             default became "default" (the user wanted "restricted by default on every
#             start"), so "leaving this section out" now means the restricted tier.
# "fixed"   = one fixed directory; give it with `root` below.
# An unrecognized name **errors out at startup** rather than quietly falling back to default.
#
# ⚠️ Only "write" and "delete" are blocked: **reading files is not limited by the workplace** --
#     read_file / list_dir can read anything on the device (reading doesn't change the device,
#     and the point is that "looking something up elsewhere" shouldn't need elevation).
#
# Scope: the host's built-in file tools (read_file / write_file / list_dir / remove), and the
# **declared path arguments** of plugin tools (the host scans by argument name -- a coarse
# net). That coarse net always judges as "write" -- the host can't tell whether a plugin takes
# that path to read or to write, so fs-family plugins are refused even for out-of-area reads in
# the restricted tier (the host's own read_file is not).
# ⚠️ It **cannot stop a misbehaving plugin from open()-ing a file itself** -- that needs OS-level
# isolation (AppContainer).
# You don't have to change this to switch tiers at runtime: use /workplace at the command line
# (the old /workspace name works too), or the "workplace" button at the input box's bottom-left
# in the GUI.
mode = "default"

# The fixed workplace directory when mode = "fixed". Relative paths are resolved against the
# **application root**.
# root = "sandbox-work"

[history]
# Conversation history is written to disk automatically, **per workspace**: one .jsonl file per
# conversation, under <workspace>/.aox/history/. History therefore travels with the folder it was
# made in -- copy a workspace and its conversations come along. The default workspace is the app
# root, so its own history sits at <app root>/.aox/history/.
# Use /history in the CLI; in the GUI use the leftmost icon to open the sidebar.
#
# With this off, no new file is written (existing history stays readable and viewable).
enabled = true
# How many recent conversations to keep, **counted across all workspaces together**; older ones
# beyond that are deleted oldest-first. 0 = unlimited.
# Cleanup only happens alongside creating a new conversation file -- nothing scans in the
# background or deletes on a timer.
keep = 200

[store]
# The **storage backend** for conversation history.
#
# This is the configuration entry point of the "storage seam": callers speak purely in terms of
# a conversation id and care neither where history lands nor in what format. Right now only
# "jsonl" (one file per conversation) exists, and it is the default.
#
# There will be other backends one day (all conversations in one sqlite database, say) -- then
# "swap the backend" is one line here, not a code change. An unrecognized name **errors out at
# startup** rather than quietly falling back to jsonl (otherwise you'd write sqlite and still
# be writing into jsonl, which is the hardest kind of problem to find).
backend = "jsonl"

[recovery]
# ── task-level file checkpoints and /rollback ───────────────────────────────────
#
# Before a task overwrites/deletes a file, the old bytes are saved under
# <workspace>/.aox/backup/. Identical content is stored once. No directory or store is created
# until a task really writes a file.
enabled = true

# How many user tasks remain undoable from the current cursor.
keep = 30

# Hard caps. Reaching one refuses the next capture rather than deleting the current task's
# pre-images.
max_total_mb = 512
max_file_mb = 64
max_turn_mb = 256
metadata_memory_mb = 32

# How an opaque call is guarded — a shell command, and a plugin that declares write access.
# "strict": hash the scoped tree before and after every call; the call is refused when the scan
#           cannot finish (the one case where this system blocks work, and it is your budget to raise).
# "best_effort": same scan, but only files that changed since the last call get a before-image stored;
#           the recovery point is marked partial, and the call always runs.
# "off": never scan. Shell and plugin writes are then outside the rollback guarantee entirely.
shell_guard = "strict"

# Scan a plugin call only when it declares write access (an undeclared plugin counts as write).
# Read-only plugins are trusted, which is why this is worth keeping at `true` rather than scanning
# every call: a full workspace scan per read is a lot to pay for a promise the plugin already made.
protect_plugins = true

# Workspace-relative exclusions: a trailing '/' is a directory prefix; '*.ext' is a suffix.
#
# This list is a **size** decision as much as a scope one: the first strict shell command caches a
# copy of every trackable file so the command's writes can be undone. A workspace that also holds a
# downloaded toolchain (`runtime/`, `.venv/`) or generated bundles can turn "one HTML file" into tens
# of megabytes. Excluded paths are still protected by the workplace boundary — they are only outside
# the rollback guarantee.
exclude = [
    ".aox/", ".git/", ".hg/", ".svn/",
    "target/", "node_modules/", ".venv/", "venv/", "__pycache__/",
    ".pytest_cache/", "runtime/", ".workbuddy/", "dist/", "build/", "out/",
    "*.tmp", "*.swp", "*.lock",
]

[shell]
# ── the built-in command line (the `bash` / `shell` tools) ───────────────────────
#
# Which tool the model is told to reach for **first**. This is wording, not a fallback: the host
# never runs a command twice to find out which shell accepts it (a command has side effects), so
# what it changes is the instruction in the system prompt, the `/shell` report, and the
# "Command line" row in Settings -> System.
#   "bash" (default) = bash first — pipes, globs, $(…), &&, sed/grep/find/awk: one call does the
#                      whole job, and a wrong guess costs a whole model round trip.
#   "cmd"            = cmd.exe first — starts ~3x faster (~87 ms vs ~270 ms) and takes C:\ paths
#                      and /flag arguments verbatim. `cmd` is already the `shell` tool's default
#                      dialect, so this adds no tool name and no schema to the request.
prefer = "bash"

enabled = true            # false = neither tool is registered; the model never sees them
bash = "auto"             # auto | off | an absolute path to bash.exe
bash_pack = "runtime"     # whether <app root>\runtime\bash\ is considered by `auto`
timeout_secs = 60         # per call; a call may ask for more via its own timeout_secs
max_timeout_secs = 600    # hard ceiling
idle_timeout_secs = 30    # kill a call that prints nothing for this long (0 = off). Measured from
                          # the last byte, so a build that keeps printing is never killed for being
                          # slow; a wedged command is reaped in 30 s instead of at the 120 s cap.
                          # A call may raise it via its own `idle_secs` (e.g. a long `sleep`).
max_output_bytes = 131072 # per stream; beyond it the head and the tail are kept
max_processes = 16        # one Job Object per call; 0 = the command may not spawn anything
# Long-lived jobs (`shell_job`, for `npm run dev` and similar). They are still Job Objects with
# KILL_ON_JOB_CLOSE; the runtime owns them so they survive the launching call, and explicit `stop`,
# the lifetime cap, or AOX exiting still kills the whole tree.
background_max_jobs = 4       # 0 disables background jobs
background_max_processes = 64 # per job; browsers need more than a build
background_max_hours = 2      # 0 = no lifetime cap (stop explicitly)
env_cache = true          # point CARGO_HOME / npm / pip / TMP into <workspace>\.aox
track_changes = true      # report which workspace files the call changed
# There is deliberately no `boundary` switch: the only layer is the host's command scan, and
# docs/SHELL.md records why a kernel-enforced version was measured not to hold.

[web]
# ── the built-in fetch tool (`web_fetch`) ─────────────────────────────────────────
#
# One URL in, text out. Read `docs/WEB.md` before tightening anything here: the short version is
# that this is a **guard rail, not a network boundary** — the shell tool reaches the same hosts.
# What `egress` buys is that the new, prompt-free path is never wider than the old, prompt-gated one.

enabled = true            # false = the tool is never registered; the model never sees it

# public | any | allowlist
#   public    = refuse loopback, RFC1918, link-local, CGNAT, multicast, unspecified (the default)
#   any       = refuse nothing (what the shell can effectively reach)
#   allowlist = refuse everything except `hosts`
egress = "public"

# Exceptions for `public`, or the whole list for `allowlist`.
# Matching is on label boundaries: "example.com" also matches "www.example.com",
# "*.example.com" matches subdomains only. A local dev server is one line:
#   hosts = ["127.0.0.1"]
hosts = []

max_chars = 12000         # default per-result budget (still clamped by [agent] max_result_chars)
hard_max_chars = 48000    # ceiling for an explicit max_chars
max_bytes = 4194304       # text/HTML body cap, counted after decompression
max_save_bytes = 33554432 # save = true cap (PDFs, images, archives)
timeout_secs = 30         # total per call; a call may ask for less, never more than the ceiling
max_timeout_secs = 60
max_redirects = 5         # every hop is checked against `egress` again


user_agent = ""           # empty = "AOX/0.1 (local agent)"; set it if a site blocks the default
charset_fallback = "gb18030"  # gb18030 | windows-1252 | none — tried when nothing declares one

# rustls uses the bundled roots, NOT the Windows certificate store. An intranet root has to be
# named here (PEM), or accepted with insecure_tls — which is a last resort, not a setting.
ca_bundle = ""
insecure_tls = false

[runtimes]
# Plugin runtime commands (the python plugin / node plugin / rust plugin compiler).
#
# Values may be written two ways, with different meanings:
#   * a bare command (as below) -> the host searches "PATH, then the runtime bundled in the app
#     directory", in that order: a complete system install has pip, venv and the full stdlib, so it
#     beats the embeddable runtime. The bundled runtime means <app root>/runtime/python/python.exe
#     and is the fallback; unpacking one there takes effect with no change to this line. Use
#     `/runtime install python` to provision it automatically (~10 MB).
#     A PATH candidate that is only a Windows "app execution alias" (0 bytes, opens the Store) is
#     skipped — path / runtime 段 no longer silently wins on such machines.
#   * a full path (e.g. 'C:\Python313\python.exe') -> taken as-is, never displaced by the
#     bundled runtime. With backslashes in the path, prefer a TOML literal string (single
#     quotes) so things like \n aren't read as escapes.
# "system" (default) = PATH first, bundled runtime as the fallback.
# "builtin" = ignore PATH for bare commands and use the bundled runtime whenever it is installed;
#             the escape hatch for a system interpreter that is broken in a way no file check can see.
prefer = "system"

python = "python"
node = "node"
rustc = "rustc"

# Optional: override the download source for the Python runtime. Leave empty to use CPython's
# official embedded distribution.
# Point it at your own mirror for an intranet or for speed; upload the
# dist/aox-python-runtime.zip produced by `bash tools/build_installer.sh pack` to your own CDN.
# python_url = "https://your-mirror.example.com/python-3.13.7-embed-amd64.zip"

# Optional: the expected SHA-256.
#   * left empty: the built-in official checksum is applied to the default official source; a
#     custom source is not verified.
#   * must be filled in when self-hosting (otherwise nothing is verified); get it with
#     `certutil -hashfile <package> SHA256`.
# python_sha256 = "f6cca216a359be84797cabb54149ce5e062afb16cc7567eb7fc51cacb2d86b65"

[theme]
# ── interface appearance (GUI only) ───────────────────────────────────────────────
#
# Left entirely empty / commented out, the appearance is **pixel for pixel** the factory state
# -- this section exists purely for "change it if you want to".
# Changes take effect after **restarting the GUI**; no recompilation needed.
#
# To swap the whole look in one go, the command-line flag is simpler:
#     aox-gui --theme themes\high-contrast.toml
# A file given via --theme **replaces this section wholesale** (it is not merged field by
# field); see themes/paper.toml, themes/ink.toml and themes/high-contrast.toml for examples.

# Initial light/dark: "light" (paper) / "dark" (ink).
#
# ⚠️ This one has the **lowest** priority: as soon as you switch light/dark by hand once, that
#    wins (recorded in <app root>/.aox-gui-theme). To make this line take effect, delete that
#    file first.
# mode = "dark"

# ── colours: override field by field ──────────────────────────────────────────────
# Write only the fields you want to change; anything unwritten inherits from the built-in.
# Colours may be written as "#RRGGBB" / "#RRGGBBAA" / "#RGB", or as an array
# [r, g, b] / [r, g, b, a] (alpha is opacity, FF = fully opaque).
#
# The 18 available fields (for their meanings see the full template in themes/ink.toml):
#   bg  panel  surface  surface_hi  border  border_strong
#   text  text_dim  text_faint  ink  ink_soft  user_bg
#   code_bg  code_chip  quote_bar  reverse_bg  on_reverse  shadow
#
# [theme.light]
# text = "#1A1916"
# ink = "#1A1916"
#
# [theme.dark]
# text = "#EAE7DF"
# ink = "#ECE9E1"

# ── font sizes and metrics ────────────────────────────────────────────────────────
# The factory value is in brackets; write only the ones you want to change.
# [theme.metrics]
# body_size = 16.0                # baseline body text
# heading_size = 21.0             # headings
# button_size = 15.0              # button text
# small_size = 13.0               # small text
# mono_size = 14.5                # monospace (code blocks)
# card_radius = 14                # card corner radius
# item_spacing = [10.0, 10.0]     # widget spacing [horizontal, vertical]
# button_padding = [14.0, 9.0]    # button padding [horizontal, vertical]
# interact_height = 30.0          # minimum height of an interactive widget
# indent = 22.0                   # indentation

# ── fonts ─────────────────────────────────────────────────────────────────────────
# Left empty, fonts are looked up automatically via "the AOX_GUI_FONT* environment variables ->
# a system font candidate list"; you normally don't need to change this.
# With backslashes in the path, use single-quoted literals so things like \n aren't read as
# escapes.
# [theme.fonts]
# cjk   = 'C:\Windows\Fonts\Deng.ttf'          # body text / CJK
# bold  = 'C:\Windows\Fonts\Dengb.ttf'         # bold
# serif = 'C:\Windows\Fonts\georgia.ttf'       # serif (secondary headings)
# brand = 'C:\Windows\Fonts\Gabriola.ttf'      # brand face (the empty-state wordmark)
# mono  = 'C:\Windows\Fonts\CascadiaMono.ttf'  # monospace (code blocks)
