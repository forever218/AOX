# AOX — 自我增长的 AI 编程代理
# 复制本文件为 config.toml 并填写你的配置

[provider]
# OpenAI 兼容协议端点（DeepSeek / Kimi / OpenAI / vLLM / Ollama 均可）
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
# 二选一：直接写 key，或指定环境变量名（推荐）
# api_key = "sk-..."
api_key_env = "DEEPSEEK_API_KEY"
# 单次回复的最大输出 token。
# ⚠️ 思考模式模型（如 deepseek-flash / deepseek-reasoner）的「推理 token」也计入此额度，
#    给太小会导致正文为空、表现成「任务莫名中断」，建议 ≥ 8192。
#    注意各家服务端有上限（DeepSeek 为 393216），填超了会被直接 400 拒绝。
max_tokens = 8192
temperature = 0.3
# 是否以 SSE 流式方式请求（默认 true）。
# 开启后，思考模式模型的推理过程会在等待时实时滚动显示（响应结束即消失）。
# 若某个端点不接受 stream / stream_options 参数，设为 false 回退为等完整响应。
stream = true

[auth]
# 元工具（create_plugin / remove_plugin 等改变系统自身的操作）：ask | auto | deny
meta_tools = "ask"
# 模型自己造出来的插件工具：ask | auto | deny
plugin_tools = "auto"
# 按工具名或插件名单独覆盖：
# [auth.overrides]
# shell_exec = "ask"

[agent]
# 项目规则文件，存在则注入系统提示
rules_file = "RULES.md"
# 单次工具调用超时（秒）
tool_timeout_secs = 120
# 送回模型的工具结果最大字符数（超出截断）
max_result_chars = 20000

[runtimes]
# 插件运行时命令（python 插件 / node 插件 / rust 插件编译器）。
#
# 值有两种写法，语义不同：
#   * 裸命令（下面这种）→ 宿主按「应用目录内置运行时 → PATH」的顺序查找。
#     内置运行时指 <应用根>/runtime/python/python.exe；把运行时解压到那里就自动生效，
#     无需改这一行。用 /runtime install python 可自动装配（约 10 MB）。
#   * 完整路径（如 'C:\Python313\python.exe'）→ 直接采用，绝不被内置运行时顶替。
#     路径里有反斜杠时建议用 TOML 字面量字符串（单引号），免得 \n 之类被当转义。
python = "python"
node = "node"
rustc = "rustc"

# 可选：覆盖 Python 运行时的下载源。留空用 CPython 官方嵌入式发行版。
# 需要内网 / 加速时指向自建镜像；`bash tools/build_installer.sh pack` 产出的
# dist/aox-python-runtime.zip 上传到自己的 CDN 即可。
# python_url = "https://your-mirror.example.com/python-3.13.7-embed-amd64.zip"

# 可选：期望的 SHA-256。
#   * 留空时：默认官方源套用内置的官方校验值；自定义源则不校验。
#   * 自己托管时必须填（否则不会校验），可用 `certutil -hashfile <包> SHA256` 取。
# python_sha256 = "f6cca216a359be84797cabb54149ce5e062afb16cc7567eb7fc51cacb2d86b65"
