# AOX composition manifest (stage 5)
#
# Copy this file to aox.toml and drop it into the application root (the same directory as
# config.toml) and it takes effect.
# **With no such file, the configuration is just the single config.toml layer** -- exactly as
# it was before this feature existed.
#
# ── what this file governs ────────────────────────────────────────────────────────
#
# It answers one question only: **which layers this configuration is merged from, and in what
# order**. Values themselves are not written here.
#
#     Configuration layers (low → high, later ones override earlier ones):
#
#       1..n      bundle          the factory choice: a set of nameable, replaceable
#                                 capability packs (see bundles/)
#       n+1..m    patch           your own customization layers, stacked in the order below
#       last      config.toml     ⚠️ always strongest, and not governed by this file
#
# Merge rule: **two tables are deep-merged (only the keys you wrote change); everything else
# (scalars / arrays) is replaced wholesale.**
#
# ── want to see something concrete ────────────────────────────────────────────────
#
#     aox --dump-config        print the layer list plus every merged value, marked with the
#                              layer it came from
#     aox --profile strict     switch profile temporarily (without editing this file)
#     aox --manifest <path>    switch manifest file temporarily
#
# Once running, type /config at the command line for a short view of "how many values each of
# these layers wrote".

profile = "default"

[profiles.default]
# The factory choice. `core` is an aggregator name: it carries no values of its own and expands
# into five leaf bundles:
#     llm-openai + tools + store-jsonl + loop-standard + prompt-core
# The contents live in bundles/*.toml as plain text you can read directly.
#
# **To change the factory choice, don't edit core** -- swap the list here, or stack a patch.
bundles = ["core"]
# Your own customization layers, stacked in order (later ones override earlier ones).
# Uncomment to use. Paths are **relative to the application root**; absolute paths work too.
# A missing file is an error at startup, never a silent skip.
patches = []

[profiles.strict]
# A second example: stack one more, more conservative bundle on top of the factory choice --
# it changes just 3 keys of its own (meta tools blocked, plugin tools downgraded to ask, tool
# timeout tightened to 30 seconds).
# Try it: aox --profile strict --dump-config
bundles = ["core", "strict"]
patches = []

# ── what "tables deep-merge, everything else replaces" actually means ──────────────────
#
# ① Tables deep-merge. The factory choice has agent.tool_timeout_secs = 60 and
#    agent.max_result_chars = 20000; you write only this in your own patch:
#
#        [agent]
#        tool_timeout_secs = 5
#
#    The result is a timeout of 5 with max_result_chars still 20000 -- **not** the whole agent
#    table being swapped out.
#
# ② Arrays are replaced wholesale. For example bundles/prompt-core.toml has order = [];
#    writing order = ["env"] in a patch gives you ["env"].
#
#    **There is no "append one item to the array" semantics** (that would need a syntax of its
#    own). To list several segments in [prompt] order, write all of them in the same place.
#
# ③ An unrecognized bundle name, a missing patch file, a cycle among bundles, or a profile that
#    isn't here: all of them **error out at startup**. A silent skip ends in "I definitely
#    wrote that layer, so why isn't it taking effect", and that is the hardest kind of problem
#    to track down.
