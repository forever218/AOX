# AOX 组合清单（阶段 5）
#
# 复制本文件为 aox.toml、放到应用根下（与 config.toml 同目录）即生效。
# **没有这个文件时，配置就只有 config.toml 一层** —— 与加入本功能之前完全一致。
#
# ── 这份文件管什么 ────────────────────────────────────────────────────────
#
# 它只回答一个问题：**这份配置由哪几层、按什么顺序合出来**。值本身不写在这里。
#
#     配置层（低 → 高，后面的覆盖前面的）：
#
#       1..n      bundle          出厂选择：一组可命名、可替换的能力包（见 bundles/）
#       n+1..m    patch           你自己的定制层，按下面的顺序依次叠加
#       最后一层   config.toml     ⚠️ 永远最强，且不由本文件控制
#
# 合成规则：**两张表就深合（只动你写了的那几个键），其余（标量 / 数组）整体替换。**
#
# ── 想看点具体的 ──────────────────────────────────────────────────────────
#
#     aox --dump-config        打印层清单 + 合成后的每个值，标出它来自哪一层
#     aox --profile strict     临时换一个 profile（不改本文件）
#     aox --manifest <路径>     临时换一个清单文件
#
# 启动之后在命令行输入 /config，可以看「这几层各写了几个值」的短版面。

profile = "default"

[profiles.default]
# 出厂选择。`core` 是聚合名，它自己不带任何值，展开成五个叶子 bundle：
#     llm-openai + tools + store-jsonl + loop-standard + prompt-core
# 内容都在 bundles/*.toml 里，是纯文本，可以直接读。
#
# **想改出厂选择就别改 core** —— 在这里换列表，或者叠一层 patch。
bundles = ["core"]
# 你自己的定制层，按顺序叠加（后面的覆盖前面的）。想用就取消注释。
# 路径**相对应用根**，也可以写绝对路径。文件不存在会在启动时报错，不会静默跳过。
patches = []

[profiles.strict]
# 第二个例子：在出厂选择之上再叠一个「更保守」的 bundle ——
# 它自己只改 3 个键（元工具禁掉、插件工具降成询问、工具超时收紧到 30 秒）。
# 试试：aox --profile strict --dump-config
bundles = ["core", "strict"]
patches = []

# ── 「表深合、其余整体替换」到底是什么意思 ──────────────────────────────
#
# ① 表是深合的。出厂选择里有 agent.tool_timeout_secs = 60 与
#    agent.max_result_chars = 20000；你在自己的 patch 里只写：
#
#        [agent]
#        tool_timeout_secs = 5
#
#    结果是超时变 5、max_result_chars 仍是 20000 —— **不是**整张 agent 表被换掉。
#
# ② 数组是整体替换的。比如 bundles/prompt-core.toml 里 order = []，
#    你在 patch 里写 order = ["env"]，结果就是 ["env"]。
#
#    **没有「往数组里追加一项」的语义**（那要另造一套语法）。想在 [prompt] order
#    里同时列出好几段，就在同一个地方把它们全写出来。
#
# ③ 认不出的 bundle 名、找不到的 patch 文件、bundle 成环、这里没有那个 profile：
#    一律**启动即报错**。静默跳过的后果是「我明明写了这一层，怎么没生效」，
#    而这类问题最难查。
