"Write and inject a new tool plugin (self-growth). A plugin is a standalone subprocess that talks over the stdio line-JSON protocol (see the system prompt and plugins/sdk/PROTOCOL.md). Once created, the tools it declares are immediately callable and persisted under plugins/. If a previous creation of the same name failed and left a directory behind, it is cleaned up and rebuilt — just reuse the original plugin name." = "编写并注入一个新工具插件（自我增长）。插件是独立子进程，通过 stdio 行 JSON 协议通信（协议见系统提示与 plugins/sdk/PROTOCOL.md）。创建成功后其声明的工具立即可调用，并持久化到 plugins/ 目录。若同名插件上次创建失败留下残留目录，会自动清理后重建，直接复用原插件名即可。"
"Write the plugin's usage into the README" = "把刚才那个插件的用法写进 README"
