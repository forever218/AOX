"[If this tool is read-only, the \"do not retry\" line above does not apply]\nIf this plugin tool is only meant to **read** (scanning / counting / listing directories / parsing files), then what blocked you is not a permission, but the plugin not declaring itself read-only.\nAsk the plugin to add `\"read\"` as the 4th position of its tool declaration; after rebuilding the plugin it can access paths outside the workspace as usual. In the Python SDK you write the triple as a 4-tuple:\n  \"<tool name>\": (\"<description>\", <JSON Schema>, <handler>, \"read\")\nThe host then judges it as a **read** — the same tier as read_file / list_dir — and **no privilege escalation from the user is needed**.Conversely, tools that write files / delete things must **not** add this position." = "【如果这道工具只读，上面那句「不要重试」不适用】\n如果这道插件工具本来就只是**读**（扫描 / 统计 / 列目录 / 解析文件这类），那么拦住你的不是权限，而是插件没声明自己是只读的。\n请让插件在工具声明里补上第 4 位 `\"read\"`，重建插件后即可照常访问工作区外的路径。Python SDK 的写法是把三元组写成四元组：\n  \"<工具名>\": (\"<说明>\", <JSON Schema>, <handler>, \"read\")\n宿主随后就按「读」判 —— 与 read_file / list_dir 同一档，**不需要向用户提权**。反过来，会写文件 / 删东西的工具**不要**加这一位。\""
"[Permission boundary] {}\n\nThis is not a broken tool or a wrong argument — it is the current workspace's permission boundary.**Do not retry this call, and do not try to sneak around it another way** (the same out-of-bounds target will be refused no matter how you phrase it).\n\nPlease **relay this to the user**: the current workspace only allows **writes and deletes** inside the boundary,so you cannot modify that location. Note: **reading files is not restricted by the workspace** — if you only need to read something outside the boundary, just read it; no escalation needed.If the user really needs to write or delete there, tell them the permission can be raised like this:\n  - UI: click \"Workspace\" at the bottom-left of the input box, choose \"Default / Picked workspace / Full access\"\n  - CLI: `/workplace default` (confined to the app root), `/workplace <dir>` (a fixed directory)or `/workplace full` (full access — AOX can read and write any file on the machine)\n  - or edit `[workplace]` in config.toml (mode = \"full\" / \"default\" / \"fixed\") and restart\n\nUntil the user changes the permission, fall back to what is possible inside the workspace for the rest,or tell the user clearly that this step cannot be done and what is missing." = "【权限边界】{}\n\n这不是工具坏了，也不是参数写错了 —— 是当前工作区的权限边界。**不要重试这次调用，也不要换一种写法绕过它**（同一个越界目标怎么试都会被拒）。\n\n请把这个情况**转述给用户**：当前工作区只允许在边界之内**写入和删除**，所以你无法改动那个位置。注意：**读文件不受工作区限制** —— 如果只是要读取边界之外的内容，直接读就可以了，不必提权。如果用户确实需要写或删那个位置，请告诉他可以这样提升权限：\n  - 界面：点输入框左下角的「工作区」，选「默认 / 选择工作区 / 完全访问」\n  - 命令行：`/workplace default`（限制在应用根目录）、`/workplace <目录>`（指定目录）或 `/workplace full`（完全访问，AOX 可读写设备上的任何文件）\n  - 或改 config.toml 的 `[workplace]`（mode = \"full\" / \"default\" / \"fixed\"）后重启\n\n在用户改变权限之前，请改用工作区内可行的方案完成剩下的部分，或者明确告诉用户这一步做不了、还需要什么。"
