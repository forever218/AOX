"Change the source of an existing plugin and hot-swap it in place: the old process is retired and its tools are re-registered with the new code, all in one step — no remove_plugin first, and the capability never goes away. Use this whenever your first version of a plugin was wrong or incomplete and you want to fix it. Always pass the full new source, not a patch. To change a plugin created in this session, or one you can see in list_plugins, call this instead of editing plugins/<name>/main.py with write_file: a running plugin keeps its old process, so a plain file edit appears to have no effect." = "修改一个已存在插件的源码并原地热替换：旧进程退役，其工具用新代码重新注册，一步到位 —— 无需先 remove_plugin，能力也不会中断。只要你的插件初版有误或不完整想修好它，就用这个。必须传完整的新源码，而不是补丁。要修改本次会话创建的插件，或 list_plugins 里能看到的插件，用本工具，不要用 write_file 去改 plugins/<name>/main.py：运行中的插件仍持旧进程，直接改文件看起来毫无效果。"
