"\n\n# Workspace layout\nYour workspace is {} —— {}. The \"app root\" above is only where plugins run; your workspace can be a different directory, and it is where the user expects you to work.\n- Scratch files —— screenshots, caches, one-off output —— go under {}\\.aox\\tmp\\. That `.aox\\` folder is the host's own: `history\\` holds this workspace's conversations and `memory\\` your notes (see the next section), so read them if they help, but never reorganise or delete them. Don't scatter files in the workspace root.\n- When the user asks you to create something durable (a document, a code project), give it its own folder: {}\\workplace\\<short project name>\\, and work inside it. Name the folder after the project in a few words (e.g. workplace\\business-site).\n" = "\n\n# 工作区布局\n你的工作区是 {} —— {}。「上面的应用根目录」只是插件运行的地方；你的工作区可以是另一个目录，那才是用户期望你干活的地方。\n- 草稿文件 —— 截图、缓存、一次性输出 —— 放到 {}\\.aox\\tmp\\ 下。那个 `.aox\\` 目录是宿主自己的：`history\\` 放这个工作区的对话，`memory\\` 放你的笔记（见下一节），有用就读，但别去整理或删除它们。不要在工作区根目录里散落文件。\n- 当用户让你创建长期保留的东西（文档、代码项目）时，给它单独开一个文件夹：{}\\workplace\\<项目简短名>\\，并在里面工作。文件夹用项目名命名，几个词即可（例如 workplace\\business-site）。\n"
"writes and deletes may only land under it; reading anywhere is still allowed" = "写入与删除只能落在它下面；别处仍然可以读"
"it is unrestricted (full access): you may read, write and delete anywhere" = "它不受限（完全访问）：你可以任意读、写、删"
"\n\n# Memory (your own notes about this workspace)\nThe host sets aside a `.aox\\memory\\` folder at the workspace root for your notes. Record durable work there, in the folder you are actually working in:\n- If you are working inside a project folder (e.g. `workplace\\<project>\\`), keep the note in that project's own `.aox\\memory\\`; otherwise use the workspace root's one.\n- One markdown file per day, named after the date: `<YYYY-MM-DD>.md`. **Today is {}**.\n- **Append** to today's file rather than overwriting it: read it first, then write back the old content plus what you just added. Never wipe notes from earlier in the same day.\n- Core content only, no filler: what you did, any pitfall you hit, how you got past it, and what got finished. A few terse bullets beat a paragraph of prose.\n- Skip it for trivial questions or a one-line answer. For long-running or multi-session work, read the most recent notes first when it helps.\n" = "\n\n# 记忆（你自己关于本工作区的笔记）\n宿主在工作区根目录留了一个 `.aox\\memory\\` 文件夹供你记笔记。把你做的长期工作记在那儿，记在你**实际工作的那个文件夹**里：\n- 如果你正在某个项目文件夹里干活（例如 `workplace\\<项目名>\\`），笔记就放那个项目自己的 `.aox\\memory\\`；否则用工作区根目录的那个。\n- 每天一个 markdown 文件，按日期命名：`<YYYY-MM-DD>.md`。**今天是 {}**。\n- 往当天的文件里**追加**，不要覆盖：先读一遍，再把旧内容连同你新加的内容一起写回。绝不要抹掉当天早些时候的笔记。\n- 只写核心内容，别废话：做了什么、踩了什么坑、怎么绕过去的、完成了什么。几条精炼的要点胜过一大段话。\n- 琐碎问题或一句话就能答的跳过不写。长程或多会话的任务，需要时先读最近的笔记。\n"
"the app root; .aox/tmp/ for scratch, workplace/ for projects" = "应用根目录；草稿放 .aox/tmp/，项目放 workplace/"
"\n  ⚠️ The boundary only governs \"host-provided capabilities\": the host's built-in file tools, and the path arguments of plugin tools.\n     it cannot stop a misbehaving plugin from open()ing files by itself — that needs OS-level isolation (AppContainer).\n" = "\n  ⚠️ 这条边界只管「宿主提供的能力」：宿主的文件工具，以及插件工具声明的路径参数。\n     它挡不住一个乱来的插件自己去 open() 文件 —— 那需要操作系统级隔离（AppContainer）。\n"
"Blocked an out-of-bounds access: relative path {} (workspace root {}).This tier only accepts absolute paths inside the workspace." = "拦截了一次越界访问：相对路径 {}（工作区根 {}）。这个档位只接受工作区内的绝对路径。"
"Blocked an out-of-bounds access: {} → {}, workspace is {}.The call was not executed. (To loosen: `/workplace default|<dir>|full`,or edit [workplace] in config.toml)" = "拦截了一次越界访问：{} → {}，工作区是 {}。这次调用没有执行。（要放宽：`/workplace default|<dir>|full`，或改 config.toml 的 [workplace]）"
"This conversation's workspace isn't established yet; this write/delete was blocked — send a message and it will work." = "本对话的工作区还没确定；这次写入/删除被拦下了 —— 发一条消息就能用。"
