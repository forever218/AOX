"Ask the user to pick one of a few options and **wait for the answer** (this pauses the current round). Use it when the user must make a decision — writing \"do you choose 1 or 2?\" in the body text is useless: that is plain text, the user has to type it themselves, and nothing guarantees what they type matches your numbering. Options are numbered automatically, and the UI adds a \"type your own\" entry. The return value is the option the user picked, or a paragraph they typed themselves (that is a valid answer too — do not ask the same question again because of it)." = "请用户在几个选项里挑一个，并**等他作答**（会暂停当前这轮）。需要用户做决定时用它 —— 在正文里写「你选 1 还是 2？」是没用的：那是纯文本，用户得自己打字，他打的字与你的编号对不对得上也没人保证。选项会自动编号，界面还会附一条「自己输入」。返回值是用户选中的那一项，或者他自己打的一段话（那也是一种有效回答，不要因此重新问一遍）。"
