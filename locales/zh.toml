"You passed a relative path {} — this tier does not accept relative paths.Rewrite it as an **absolute path inside the workspace**; the workspace root is: {}.Why: the host and the plugin subprocess do not share a working directory, so the same relative path resolves totwo different files on the two sides — that inconsistency is far more dangerous than a few extra characters." = "你给的是相对路径 {}，本档位不接受相对路径。要改写成工作区内的**绝对路径**，工作区根是：{}。原因：宿主与插件子进程的工作目录不是同一个，同一串相对路径在两边会指到两个不同文件 —— 那种不一致比多写几个字符危险得多。"
"Your `filestat` plugin is ready; it provides the tool **filestat_count**.\n\n## Usage\n\n```json\n{ \"path\": \".\", \"ext\": null }\n```\n\nLeave `ext` empty to count all extensions. Result for the current directory:\n\n| Ext | Count |\n|------|------|\n| .rs | 14 |\n| .py | 9 |\n| .toml | 4 |\n| .md | 2 |\n\n> The plugin is persisted under `plugins/filestat/`; it loads automatically on the next start -- no need to rebuild." = "已经为你造好了 `filestat` 插件，它提供工具 **filestat_count**。\n\n## 用法\n\n```json\n{ \"path\": \".\", \"ext\": null }\n```\n\n`ext` 留空表示统计全部后缀。当前目录的结果：\n\n| 后缀 | 数量 |\n|------|------|\n| .rs | 14 |\n| .py | 9 |\n| .toml | 4 |\n| .md | 2 |\n\n> 插件已持久化到 `plugins/filestat/`，下次启动会自动加载，无需重建。"
