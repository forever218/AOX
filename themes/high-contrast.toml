# High contrast
#
# A set deliberately opposite in character to "paper / ink": pure black and white, explicit
# borders, sharper corners, type one size up -- for low vision, for use under strong light, or
# simply when you want a harder-edged interface.
#
#   aox-gui --theme themes/high-contrast.toml
#
# Both light and dark are defined, so whether you are currently on paper or ink you get the
# high-contrast look (a half-done theme file that defines only one of them falls back to the
# built-in palette on the other half, and the result tastes of both).
#
# This file **is** a `[theme]` section and can be **pasted wholesale into config.toml**.
#
# Note on light/dark: the `mode` below has **lower** priority than a switch you made by hand
# (which is recorded in <app root>/.aox-gui-theme); to make `mode` take effect, delete that
# file first.

[theme]
mode = "dark"

[theme.metrics]
body_size = 17.0
heading_size = 22.0
button_size = 16.0
small_size = 14.0
mono_size = 15.5
card_radius = 4
item_spacing = [8.0, 8.0]
button_padding = [12.0, 8.0]
interact_height = 32.0
indent = 20.0

[theme.light]
bg = "#FFFFFF"
panel = "#F2F2F2"
surface = "#FFFFFF"
surface_hi = "#DCDCDC"
border = "#767676"
border_strong = "#000000"
text = "#000000"
text_dim = "#3A3A3A"
text_faint = "#5A5A5A"
ink = "#000000"
ink_soft = "#3A3A3A"
user_bg = "#E4E4E4"
code_bg = "#EFEFEF"
code_chip = "#D2D2D2"
quote_bar = "#767676"
reverse_bg = "#000000"
on_reverse = "#FFFFFF"
shadow = "#00000044"
danger = "#C00000"

[theme.dark]
bg = "#000000"
panel = "#0A0A0A"
surface = "#141414"
surface_hi = "#242424"
border = "#8A8A8A"
border_strong = "#FFFFFF"
text = "#FFFFFF"
text_dim = "#D0D0D0"
text_faint = "#A0A0A0"
ink = "#FFFFFF"
ink_soft = "#C0C0C0"
user_bg = "#1A1A1A"
code_bg = "#0A0A0A"
code_chip = "#3A3A3A"
quote_bar = "#8A8A8A"
reverse_bg = "#FFFFFF"
on_reverse = "#000000"
shadow = "#000000CC"
danger = "#FF6B6B"
