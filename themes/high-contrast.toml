# 高对比 · high-contrast
#
# 与「纸 / 墨」气质相反的一套：纯黑白、明确边框、更锐的圆角、字大一号，
# 给弱视、强光下使用，或者单纯想要更硬朗的界面时用。
#
#   aox-gui --theme themes/high-contrast.toml
#
# 两套明暗**都**定义了，所以不管当前处于纸还是墨，看到的都是高对比外观
# （半吊子主题文件只定义一套的话，另一半会退回内置配色，看着会串味）。
#
# 本文件就是一份 `[theme]` 段，可以**整段粘进 config.toml**。
#
# 注意明暗：下面 mode 的优先级**低于**你手动点过的那次切换
# （记录在 <应用根>/.aox-gui-theme）；想让 mode 生效，先删掉那个文件。

[theme]
mode = "dark"

[theme.metrics]
body_size = 17.0
heading_size = 22.0
button_size = 16.0
small_size = 14.0
mono_size = 15.5
card_radius = 4
item_spacing = [8.0, 8.0]
button_padding = [12.0, 8.0]
interact_height = 32.0
indent = 20.0

[theme.light]
bg = "#FFFFFF"
panel = "#F2F2F2"
surface = "#FFFFFF"
surface_hi = "#DCDCDC"
border = "#767676"
border_strong = "#000000"
text = "#000000"
text_dim = "#3A3A3A"
text_faint = "#5A5A5A"
ink = "#000000"
ink_soft = "#3A3A3A"
user_bg = "#E4E4E4"
code_bg = "#EFEFEF"
code_chip = "#D2D2D2"
quote_bar = "#767676"
reverse_bg = "#000000"
on_reverse = "#FFFFFF"
shadow = "#00000044"

[theme.dark]
bg = "#000000"
panel = "#0A0A0A"
surface = "#141414"
surface_hi = "#242424"
border = "#8A8A8A"
border_strong = "#FFFFFF"
text = "#FFFFFF"
text_dim = "#D0D0D0"
text_faint = "#A0A0A0"
ink = "#FFFFFF"
ink_soft = "#C0C0C0"
user_bg = "#1A1A1A"
code_bg = "#0A0A0A"
code_chip = "#3A3A3A"
quote_bar = "#8A8A8A"
reverse_bg = "#FFFFFF"
on_reverse = "#000000"
shadow = "#000000CC"
