# Ink
#
# The **complete definition** of the factory ink (dark) palette -- byte for byte identical to
# the built-in colours, so:
#   aox-gui --theme themes/ink.toml
# should look **exactly** the same as running without --theme (which is handy for proving that
# the theme file really is being read).
#
# Change any lines you like to nudge it; writing only the fields you care about is fine too
# (everything else inherits from the built-in).
# Colours may be written as "#RRGGBB" / "#RRGGBBAA" / "#RGB", or as an array
# [r, g, b] / [r, g, b, a].
#
# This file **is** a `[theme]` section and can be **pasted wholesale into config.toml**;
# conversely, lifting a `[theme]` section out of config.toml gives you a theme file.
#
# Note on light/dark: the `mode` below has **lower** priority than a switch you made by hand
# (which is recorded in <app root>/.aox-gui-theme); to make `mode` take effect, delete that
# file first.

[theme]
mode = "dark"

[theme.dark]
bg = "#141412"
panel = "#191917"
surface = "#20201D"
surface_hi = "#2A2A26"
border = "#33332E"
border_strong = "#4C4C45"
text = "#EAE7DF"
text_dim = "#A39F96"
text_faint = "#716E66"
ink = "#ECE9E1"
ink_soft = "#9A968D"
user_bg = "#252521"
code_bg = "#10100E"
code_chip = "#393932"
quote_bar = "#4C4C45"
reverse_bg = "#ECE9E1"
on_reverse = "#141412"
shadow = "#00000060"
danger = "#E06C5C"
