[workspace]
# The root crate is still the CLI proper; gui/ is a separate graphical crate, and the two share
# the core library exposed by src/lib.rs.
# default-members stays ["."], so `cargo build` / `cargo run` behave exactly as they did before
# the GUI was added.
members = [".", "gui"]
default-members = ["."]
resolver = "2"

[package]
name = "aox"
version = "0.1.0"
edition = "2021"
description = "AOX — a self-growing AI agent: starts with no tools, breeds its own plugins"

[lib]
name = "aox"
path = "src/lib.rs"

[[bin]]
name = "aox"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
# Terminal Markdown rendering (headings / code blocks / lists / tables)
termimad = "0.34"

[target.'cfg(windows)'.dependencies]
# Let the legacy conhost support ANSI colours too (VT processing + UTF-8 output code page);
# and use GetLocalTime to produce "local time" file names and display strings for history --
# that way a single timestamp doesn't drag in chrono / time.
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    # The history list shows "time of the last conversation": FileTimeToLocalFileTime lives in
    # Storage::FileSystem and FileTimeToSystemTime in System::Time, so both have to be enabled.
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    # Fencing plugin subprocesses (`src/sandbox.rs`): the Job Object itself, finding and resuming
    # the main thread (`CreateToolhelp32Snapshot` + `OpenThread` + `ResumeThread`), and the
    # SECURITY_ATTRIBUTES in `CreateJobObjectW`'s signature (Win32_Security).
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    # Displaying images in the UI (`src/image.rs`): GDI+ decodes local image files. Use the
    # decoder that ships with the system rather than packing one into the binary (`image` is
    # about +300-500 KB; `png` about +100 KB and only understands PNG).
    "Win32_Graphics_GdiPlus",
    # The embedded image asset (the empty-state illustration) lives in memory with no file path,
    # so it has to be wrapped in an IStream before GDI+ can take it (`SHCreateMemStream`, in
    # Win32_UI_Shell).
    "Win32_UI_Shell",
] }


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
