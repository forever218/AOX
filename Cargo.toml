[workspace]
# The root crate is still the CLI proper; gui/ is a separate graphical crate, and the two share
# the core library exposed by src/lib.rs.
# default-members stays ["."], so `cargo build` / `cargo run` behave exactly as they did before
# the GUI was added.
members = [".", "gui", "crates/aoxchat-proto"]
default-members = ["."]
resolver = "2"

[package]
name = "aox"
version = "0.1.0"
edition = "2021"
description = "AOX — a self-growing AI agent: starts with no tools, breeds its own plugins"

[lib]
name = "aox"
path = "src/lib.rs"

[[bin]]
name = "aox"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"

# The remote-control wire protocol. Vendored from the aoxchat repo so this crate stays buildable
# offline; `tools/sync_proto.py` is the one-way copier (aoxchat/proto → here).
aoxchat-proto = { path = "crates/aoxchat-proto" }
# WebSocket client for `aox remote` (the host bridge). rustls so it shares the TLS stack reqwest
# already pulls in — one fewer OpenSSL-shaped dependency on Windows.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# Charset decoding for `web_fetch` (src/web/charset.rs). The alternative was Win32
# `MultiByteToWideChar` (zero bytes, Windows-only), rejected because GB18030/Big5 need a *validation*
# answer, not just a decode — see docs/WEB.md D2.
encoding_rs = "0.8"
# URL parsing/normalisation for `web_fetch`; already in the tree via reqwest, so this adds no build.
url = "2"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
# Terminal Markdown rendering (headings / code blocks / lists / tables)
termimad = "0.34"
# Content-addressed file backup. BLAKE3 is a change/integrity hash, not a security boundary.
blake3 = { version = "1", features = ["pure"] }

[target.'cfg(windows)'.dependencies]
# Let the legacy conhost support ANSI colours too (VT processing + UTF-8 output code page);
# and use GetLocalTime to produce "local time" file names and display strings for history --
# that way a single timestamp doesn't drag in chrono / time.
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    # The history list shows "time of the last conversation": FileTimeToLocalFileTime lives in
    # Storage::FileSystem and FileTimeToSystemTime in System::Time, so both have to be enabled.
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    # Fencing plugin subprocesses (`src/sandbox.rs`): the Job Object itself, finding and resuming
    # the main thread (`CreateToolhelp32Snapshot` + `OpenThread` + `ResumeThread`), and the
    # SECURITY_ATTRIBUTES in `CreateJobObjectW`'s signature (Win32_Security).
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    # Displaying images in the UI (`src/image.rs`): GDI+ decodes local image files. Use the
    # decoder that ships with the system rather than packing one into the binary (`image` is
    # about +300-500 KB; `png` about +100 KB and only understands PNG).
    "Win32_Graphics_GdiPlus",
    # Decoding a command's output (`src/shell/mod.rs`): `cmd` writes the ANSI code page, so a strict
    # UTF-8 decode would turn a Chinese error message into `��` and the model would read noise.
    "Win32_Globalization",
    # The embedded image asset (the empty-state illustration) lives in memory with no file path,
    # so it has to be wrapped in an IStream before GDI+ can take it (`SHCreateMemStream`, in
    # Win32_UI_Shell). The same feature also carries `SHFileOperationW`, which `src/recycle.rs`
    # uses to move deleted files into the recycle bin instead of erasing them.
    "Win32_UI_Shell",
    # The shell's file operations require COM to be initialised on the calling thread first
    # (`CoInitializeEx` / `CoUninitialize`), so `src/recycle.rs` does that itself rather than
    # assuming whichever tokio worker picks the tool call has touched COM before.
    "Win32_System_Com",
] }


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
