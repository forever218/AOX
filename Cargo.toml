[workspace]
# 根 crate 仍是 CLI 主体；gui/ 是独立的图形界面 crate，二者共用 src/lib.rs 暴露的核心库。
# default-members 保持为 ["."]，这样 `cargo build` / `cargo run` 的行为与加 GUI 之前完全一致。
members = [".", "gui"]
default-members = ["."]
resolver = "2"

[package]
name = "aox"
version = "0.1.0"
edition = "2021"
description = "AOX — a self-growing AI agent: starts with no tools, breeds its own plugins"

[lib]
name = "aox"
path = "src/lib.rs"

[[bin]]
name = "aox"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
# 终端 Markdown 渲染（标题/代码块/列表/表格）
termimad = "0.34"

[target.'cfg(windows)'.dependencies]
# 让传统 conhost 也支持 ANSI 颜色（VT 处理 + UTF-8 输出代码页）；
# 另外用 GetLocalTime 给历史记录生成「本地时间」文件名与显示串 ——
# 这样就不必为了一个时间戳引入 chrono / time。
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    # 历史列表要显示「最后一次对话时间」：FileTimeToLocalFileTime 在 Storage::FileSystem，
    # FileTimeToSystemTime 在 System::Time，两个都得开。
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    # 插件子进程的围栏（`src/sandbox.rs`）：Job Object 本体、找回并恢复主线程
    # （`CreateToolhelp32Snapshot` + `OpenThread` + `ResumeThread`）、
    # 以及 `CreateJobObjectW` 签名里的 SECURITY_ATTRIBUTES（Win32_Security）。
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
