# store-jsonl -- the storage form of conversation history: one file per conversation (JSONL).
#
# The values equal the code defaults (the `#[serde(default)]` on `StoreConfig` /
# `HistoryConfig`) -- the same reasoning as `tools.toml`: writing them out is what lets
# `--dump-config` show the provenance.
#
# This is the configuration entry point of the "storage seam": callers speak purely in terms
# of a conversation id and care neither where history lands nor in what format.
# There will be other backends one day (all conversations in one sqlite database, say) --
# then "swap the backend" means swapping one bundle here (or layering a patch), not changing
# code.

[store]
# Storage backend name. **An unrecognized name errors out at startup** rather than quietly
# falling back to jsonl -- otherwise you'd have asked for another backend and still be
# writing into jsonl, which is the hardest kind of problem to track down.
backend = "jsonl"

[history]
# With this off, no new file is opened (existing history stays readable and viewable).
enabled = true
# How many conversations to keep at most (by time, newest first); 0 = unlimited.
# Pruning happens only when a conversation is created, so the one currently being written is
# never deleted.
keep = 200
