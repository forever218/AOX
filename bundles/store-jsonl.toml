# store-jsonl —— 对话历史的存储形态：一次对话一个文件（JSONL）。
#
# 值等于代码默认（`StoreConfig` / `HistoryConfig` 的 `#[serde(default)]`）——
# 与 `tools.toml` 同理，写出来是为了让 `--dump-config` 能显示来源。
#
# 这是「存储缝」的配置入口：调用方一律按对话 id 说话，不关心历史落在哪儿、以什么格式落。
# 将来会有别的后端（比如把所有对话收进一个 sqlite 库）—— 那时「换后端」就是
# 在这里换一个 bundle（或叠一层 patch），而不是改代码。

[store]
# 存储后端名。**认不出的名字会在启动时直接报错**，不会静默退回 jsonl ——
# 否则你写了别的后端、却还在往 jsonl 里写，这种问题最难查。
backend = "jsonl"

[history]
# 关掉后不再新开文件（已存在的历史仍然可读、可查看）。
enabled = true
# 最多保留多少个对话（按时间，新的优先）；0 = 不限制。
# 只在新建对话时裁剪，所以不会删掉正在写的那个。
keep = 200
