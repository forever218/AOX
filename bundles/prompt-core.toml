# prompt-core -- assembling the system prompt from segments (core / protocol / env / rules).
#
# The segments themselves and the assembly logic live in src/prompt.rs; everything written here
# is **an empty value equivalent to not writing it at all**, present only so `--dump-config`
# can show that the key exists and where it came from.
#
# To see the prompt actually being assembled right now: type /prompt at the command line.

[prompt]
# Explicit order: the listed segments are moved to the front in this order, and unlisted ones
# keep their default order after them.
# An empty array = entirely the built-in order -- **byte for byte identical** to the built-in
# prompt.
order = []
# Segments to disable (the built-in ones are core / protocol / env / rules). An empty array
# disables none of them.
disable = []
# To append custom segments, use [[prompt.segment]]; a segment whose id matches a built-in one
# **replaces that built-in segment wholesale**.
# There are no custom segments by default, so no empty `segment` array is written here -- it
# would only add a line of noise to the dump.

[agent]
# Project rules file (RULES.md); if present it is injected as the prompt's rules segment.
rules_file = "RULES.md"
