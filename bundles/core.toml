# core -- the single entry point of the factory composition.
#
# It carries **no values of its own**; it only declares "which bundles make up this set".
# Each bundle owns one area, and the order is the priority: **later entrants override earlier
# ones**; the aggregator (this file) enters after its sub-bundles, so anything core writes for
# itself covers them.
#
# Want to change the set? Don't change this -- swap the bundle list under [profiles.<name>] in
# aox.toml, or layer a patch file on top (see aox.example.toml).
#
# These five names are the whole of the "factory choice": swap llm-openai and you swap the
# protocol family, swap store-jsonl and you swap the storage form, swap loop-standard and you
# swap the loop form.
bundles = [
    "llm-openai",     # model endpoint: the OpenAI-compatible protocol
    "tools",          # tools, the plugin runtime, and their default authorization tiers
    "web",            # the built-in fetch tool: reach, budget, escape hatches
    "store-jsonl",    # storage: one file per conversation
    "recovery",       # task-level file checkpoints and /rollback
    "loop-standard",  # loop: the standard main loop, with no hooks at all
    "prompt-core",    # prompt: the built-in segments (core / protocol / env / rules)
]
