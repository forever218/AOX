# loop-standard -- the standard main loop, with no hooks at all.
#
# This bundle **deliberately carries no values**: an empty `[hook]` section means not a single
# hook is registered, and the main loop follows exactly the path it did before the "loop seam".
# So it shows 0 values in `--dump-config`.
#
# To attach a hook, layer a patch (or write it straight into config.toml):
#
#   [hook.tool_args_default.fs_read_file]
#   encoding = "utf-8"
#
# Mind where hooks stop: `[hook]` only governs "once allowed, should anything be changed";
# whether a call is allowed at all is a matter of authorization, owned by [auth] (see
# tools.toml).
#
# "Swap in a different loop shape" -- pruning history, retrying failures, rewriting the whole
# request -- is not something configuration can express; that means replacing the whole
# AgentLoop. For when, and to what shape, see docs/ARCH-ROADMAP.md, stage 6.
