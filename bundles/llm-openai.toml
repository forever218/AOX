# llm-openai -- the model endpoint block: the OpenAI-compatible protocol.
#
# ⚠️ This **deliberately writes only `stream`**, not base_url / model / api_key: those three
# have no factory value (hard-coding an endpoint would be deciding for the user where their
# requests go) and must be supplied by the user -- normally in config.toml (the last layer),
# or in a patch of your own.
#
# When moving to another protocol family, this is "the place that will have to change" (for
# example, an endpoint that doesn't accept stream_options).

[provider]
# SSE streaming: a reasoning model's chain of thought can therefore be echoed in real time (it
# disappears once the response ends).
# If an endpoint rejects stream / stream_options, write `stream = false` in config.toml.
stream = true
