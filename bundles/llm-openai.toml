# llm-openai —— 模型端点这一块：走 OpenAI 兼容协议。
#
# ⚠️ 这里**故意只写 stream**，不写 base_url / model / api_key：
# 那三项没有出厂值（写死一个端点等于替用户决定往哪儿发请求），必须由用户提供 ——
# 通常写在 config.toml（最后一层），或写在你自己的 patch 里。
#
# 换成别的协议家族时，这里是「以后要动的地方」（比如某个不认 stream_options 的端点）。

[provider]
# SSE 流式：思考模型的推理过程因此能实时回显（响应结束即消失）。
# 某个端点不接受 stream / stream_options 时，在 config.toml 里写 stream = false 即可。
stream = true
