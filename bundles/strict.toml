# strict -- a second example bundle. It is **not part of the factory choice**; it is a
# template for "one small bundle that changes a handful of keys".
#
# It writes no `bundles = [...]`: it is a **leaf** and only contributes values. Usage (in your
# aox.toml):
#
#   [profiles.strict]
#   bundles = ["core", "strict"]
#
# Because the layer stack is "expand all of core's sub-bundles first, and only then strict",
# the keys changed here reliably cover the factory choice -- which is exactly the shape that
# "switch to a more conservative policy" should take: swap the bundle list, change not a word
# of core.
#
# Whoever reads this file should see at a glance where it is stricter than the factory: meta
# tools blocked, plugin tools downgraded to ask, tool timeout tightened. The smaller the scope,
# the easier it reads.

[auth]
# Operations that **change the system itself**, such as creating or deleting plugins: blocked
# outright here, giving the model no opening at all.
meta_tools = "deny"
# Tools from plugins the model built for itself are no longer allowed automatically; every one
# of them needs your nod.
plugin_tools = "ask"
# The command line asks too. The factory default is `auto` (a command line is guarded by the
# workplace boundary and the per-turn backup, not by a click); being stricter is the whole point
# of this bundle, so it is spelled out here rather than inherited.
shell = "ask"
# Reaching the network is not automatic either: every fetch asks once, then the session remembers.
web = "ask"

[agent]
# Tool timeout tightened from the factory 60 seconds to 30.
# (Note that only this one field is written: the `agent` table also defines max_result_chars in
#  tools.toml, and the two layers are **deep-merged**, so that field still applies -- this is
#  not overwriting the whole table.)
tool_timeout_secs = 30
