# strict —— 第二个例子 bundle。**不进出厂选择**，是「一个小 bundle 只改几个键」的样板。
#
# 它不写 `bundles = [...]`：它是个**叶子**，只贡献值。用法（在你的 aox.toml 里）：
#
#   [profiles.strict]
#   bundles = ["core", "strict"]
#
# 因为层栈是「先展开 core 的全部子 bundle，最后才轮到 strict」，所以这里改的键
# 会稳稳盖住出厂选择 —— 这正是「换一套更保守的策略」应该有的形态：
# 换 bundle 列表，不改 core 一个字。
#
# 读这个文件的人应该能一眼看出它比出厂严在哪儿：元工具禁掉、插件工具降成询问、
# 工具超时收紧。范围越小越好读。

[auth]
# 造插件、删插件这类**改动系统自身**的操作：本套直接禁掉，不给模型开口子的机会。
meta_tools = "deny"
# 模型自己造出来的插件工具不再自动放行，每次都要你点头。
plugin_tools = "ask"

[agent]
# 工具超时从出厂的 60 秒收紧到 30 秒。
# （注意这里只写了这一项：`agent` 表在 tools.toml 里还定义了 max_result_chars，
#   两层是**深合**的，所以那一项仍然有效 —— 不是覆盖掉整张表。）
tool_timeout_secs = 30
