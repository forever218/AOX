# tools -- tools, the plugin runtime, and their default authorization tiers.
#
# Every value written here **equals the default in the code** (the `#[serde(default)]` on
# `AuthConfig` / `RuntimesConfig` / `AgentConfig`). Why write them out a second time? So that
# `aox --dump-config` can show "which layer this value came from" instead of labelling
# everything "default (code)".
#
# The price is one extra source of defaults (bundle and code). The way drift is prevented
# isn't good intentions -- `core_equals_code_defaults` in `layer.rs` compares field by field,
# and any change that isn't kept in sync goes red.
#
# The tools themselves (fs_read / shell_exec / ...) and their implementations are not in
# config, they live in src/tool/; this only governs "how tools get authorized, which
# interpreter plugins run on, and how long a single call may take".

[auth]
# Meta tools (create_plugin / remove_plugin and other operations that **change the system
# itself**): ask | auto | deny
meta_tools = "ask"
# Tools from plugins the model built for itself: ask | auto | deny
plugin_tools = "auto"
# The built-in web tool (web_fetch): ask | auto | deny
# It has its own tier because it is the only capability that leaves the machine; `[web] egress`
# already keeps it narrower than the shell, so the default is auto rather than ask.
web = "auto"
# To allow or block by tool name / plugin name, write under [auth.overrides]:
#   shell_exec = "ask"    exact match
#   fs_*       = "deny"   prefix wildcard (prefix only, so `fs*` hits fsx as well)

[runtimes]
# Values may be written two ways, with different meanings:
#   * a bare command (as below) -> the host searches "runtime bundled in the app directory,
#     then PATH", in that order. The bundled runtime means <app root>/runtime/python/python.exe;
#     use `/runtime install python` to provision it.
#   * a full path (e.g. 'C:\Python313\python.exe') -> taken as-is, never displaced by the
#     bundled runtime.
python = "python"
node = "node"
rustc = "rustc"

[agent]
# Timeout for a single tool call (seconds)
tool_timeout_secs = 60
# Maximum number of characters of a tool result sent back to the model (truncated past this)
max_result_chars = 20000
